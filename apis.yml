name: Fincompare
description: >-
  Fincompare (now operating under the Fynbiz brand alongside Compeon) is a
  Berlin-based digital financing marketplace for small and medium-sized
  enterprises. Founded in 2017, the platform lets businesses request, compare,
  and close financing offers from 100+ banks and alternative lenders in one
  place, covering business loans, leasing, factoring, goods and warehouse
  financing, real-estate financing, and revenue-based financing. Fincompare
  connects lenders such as ING, VR Smart Finanz, and iwoca directly through
  bank API integrations to automate credit decisions. The company was acquired
  by a consortium of DZ Bank, several Volksbanken, and Atruvia in 2021.
  Fincompare operates a customer-facing SME financing product; it does not
  publish a public developer API or documentation surface.
